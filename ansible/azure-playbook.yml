- name: Configure PawPal server
  hosts: server
  become: true

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: true

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Update apt package cache after adding Docker repository
      apt:
        update_cache: true

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Add azureuser to Docker group
      user:
        name: azureuser
        groups: docker
        append: true

    - name: Pull PawPal image
      community.docker.docker_image:
        name: ghcr.io/pand3/pawpal:latest
        source: pull

    - name: Run PawPal container
      community.docker.docker_container:
        name: pawpal
        image: ghcr.io/pand3/pawpal:latest
        state: started
        restart_policy: unless-stopped
        ports:
          - "3000:3000"
