name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

  docker:
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker build \
          -t ghcr.io/$OWNER/pawpal:latest \
          -t ghcr.io/$OWNER/pawpal:${GITHUB_SHA} \
          .

      - name: Push Docker image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker push ghcr.io/$OWNER/pawpal:latest
          docker push ghcr.io/$OWNER/pawpal:${GITHUB_SHA}
